
name: Build, Push and Deploy SLRmentor Backend

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: read

concurrency:
  group: slrmentor-backend-deploy
  cancel-in-progress: false

jobs:

  # ==========================================
  # PHASE 1: Generate Docker Image Version
  # ==========================================

  version:
    name: "1. Generate Version"

    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'backend'

    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.generate.outputs.version }}

    steps:
      - name: Generate version
        id: generate
        shell: bash
        env:
          COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          TIMESTAMP=$(date -u +"%Y%m%d.%H%M%S")
          SHORT_SHA="${COMMIT_SHA:0:7}"
          VERSION="v${TIMESTAMP}-${SHORT_SHA}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Generated version: $VERSION"


  # ==========================================
  # PHASE 2: Build and Push Docker Image
  # ==========================================

  build-and-push:
    name: "2. Build & Push Docker Image"

    needs: version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout merged commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Exclude environment files
        shell: bash
        run: |
          cat >> backend/.dockerignore <<'EOF'

          # Environment files
          .env
          .env.*
          **/.env
          **/.env.*

          # Local Python environment
          .venv/
          __pycache__/
          *.pyc
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: seallabuofc
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            seallabuofc/slrmentor-backend:${{ needs.version.outputs.version }}
            seallabuofc/slrmentor-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build summary
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          echo "### Docker Image Published" >> "$GITHUB_STEP_SUMMARY"
          echo "- Repository: seallabuofc/slrmentor-backend" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: $VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "- Latest: updated" >> "$GITHUB_STEP_SUMMARY"


  # ==========================================
  # PHASE 3: Deploy Image to Render
  # ==========================================

  deploy:
    name: "3. Deploy to Render"

    needs:
      - version
      - build-and-push

    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render deployment
        shell: bash
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          curl --fail --silent --show-error \
            --retry 3 \
            --request POST \
            "$RENDER_DEPLOY_HOOK"

      - name: Deployment summary
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          echo "### SLRmentor Backend Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: seallabuofc/slrmentor-backend" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: $VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "- Render deployment: triggered" >> "$GITHUB_STEP_SUMMARY"
