name: Build, Push and Deploy SLRmentor Backend

on:
  pull_request:
    branches:
      - main
    types:
      - closed

jobs:
  build-push-deploy:
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'backend'

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout merged main branch
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Determine next version
        id: version
        shell: bash
        run: |
          git fetch --tags

          LATEST_TAG=$(git tag -l "v*" --sort=-v:refname | head -n 1)

          if [ -z "$LATEST_TAG" ]; then
            NEW_VERSION="1.0.0"
          else
            VERSION=${LATEST_TAG#v}

            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

            PATCH=$((PATCH + 1))

            NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          fi

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Next version: $NEW_VERSION"

      - name: Create Git version tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            seallabuofc/hala-backend:v${{ steps.version.outputs.version }}
            seallabuofc/hala-backend:latest

      - name: Deploy latest image to Render
        shell: bash
        run: |
          curl --fail --silent --show-error \
            --request POST \
            "${{ secrets.RENDER_DEPLOY_HOOK }}"