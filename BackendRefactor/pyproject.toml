[project]
name = "SLRmentor_Backend"
version = "0.1.0"
description = "SLRmentor backend is the api server that servers the frontends requests"
readme = "README.md"
requires-python = ">=3.14.5"
dependencies = [
    "flask>=3.1.3",
    "flask-cors>=6.0.5",
    "flask-pymongo>=2.3.0",
    "google-genai>=2.10.0",
    "gunicorn>=26.1.0",
    "openai>=2.44.0",
    "pydantic>=2.13.4",
    "pymongo[srv]>=4.6.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]
